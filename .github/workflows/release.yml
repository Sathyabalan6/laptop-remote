name: Release & Windows Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: 'Publish package to PyPI (requires PyPI Trusted Publisher configured)'
        required: false
        type: boolean
        default: false

jobs:
  build-windows:
    name: Build Windows Standalone Executable
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[windows,build]"

      - name: Build LaptopRemote-CLI.exe
        run: pyinstaller laptop_remote_cli.spec --noconfirm

      - name: Smoke test executable
        run: .\dist\LaptopRemote-CLI.exe --help

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: LaptopRemote-Windows-CLI
          path: dist/LaptopRemote-CLI.exe

  build-package:
    name: Build Python Package (Wheel & sdist)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install build tools
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload Distribution Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*

  github-release:
    name: Create GitHub Release
    needs: [build-windows, build-package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: LaptopRemote-Windows-CLI
          path: release-assets/

      - name: Download Python Artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true

  pypi-publish:
    name: Publish to PyPI
    needs: [build-package]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_to_pypi == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/laptop-remote
    permissions:
      id-token: write

    steps:
      - name: Download Python Artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true
