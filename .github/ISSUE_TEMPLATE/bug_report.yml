name: 🐛 Bug Report
description: Report something that isn't working as expected
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much detail as you can.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I open the Mouse tab and drag, nothing moves...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the server with ./run.sh
        2. Pair the phone
        3. Open the Mouse tab
        4. Drag on the trackpad
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Laptop operating system
      placeholder: e.g. Ubuntu 24.04 (Wayland), Windows 11, macOS 14
    validations:
      required: true

  - type: dropdown
    id: session
    attributes:
      label: Linux display server (if applicable)
      options:
        - Not Linux / N/A
        - Wayland
        - X11 / Xorg
        - Not sure

  - type: input
    id: phone
    attributes:
      label: Phone / browser
      placeholder: e.g. iPhone 15 Safari, Pixel 8 Chrome

  - type: input
    id: version
    attributes:
      label: Laptop Remote version / commit
      placeholder: e.g. v1.0.0 or commit hash

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or console messages
      description: Paste terminal output, and any browser console errors.
      render: shell
    validations:
      required: false
